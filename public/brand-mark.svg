<svg xmlns="http://www.w3.org/2000/svg" viewBox="136 503 140 140" role="img" aria-label="Company mark">
<!--
  The company symbol, for the screen. Not the letterhead.

  assets/letterhead-logo.svg is the printed lockup and is prepared for pdfmake,
  which is why it is not reused here. Three things differ:
    1. The fill is white, because this sits on the navy bar. The letterhead is
       navy on white paper and would be invisible.
    2. The symbol only. The full lockup carries the wordmark and, under it, a
       tagline in 21 units of a 146 unit box. At the 28px this is drawn at, the
       tagline is four pixels of grey mush, so the name is set as type beside
       the mark instead, where it stays legible and stays configurable.
    3. Cropped to the symbol's own bounds, so it scales to a square.

  Replace this file to put another company in the bar, the same way
  assets/letterhead-logo.svg is replaced to put one on the letterhead. The
  company name itself is never in either file: it is COMPANY_NAME.
-->
