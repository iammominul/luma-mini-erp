<svg xmlns="http://www.w3.org/2000/svg" viewBox="134 500 864 146">
<!--
  Letterhead logo, prepared for pdfmake.

  Three things differ from the design export, and each one matters:
    1. Every fill is an attribute on its element. pdfmake renders a string SVG
       with useCSS false, so the export's stylesheet block and its st0 and st2
       class references would have been ignored and the logo would print black.
    2. The wordmark is outline paths only. The export also set LUMA TEXTILE as
       live type in Garet Bold, and a face this renderer does not carry either
       fails or gets substituted. The same letters are already outlined here, so
       the duplicate live type and its overlapping heavier LUMA were dropped.
    3. The viewBox is cropped to the artwork. The export sat inside a 1117 unit
       square of mostly empty space, which would scale the logo to nothing.

  Replace this file to put another company on the letterhead. The app reads it
  by path and falls back to COMPANY_NAME set as type when it is absent, and
  pdf.test.ts checks the three rules above still hold.
-->
